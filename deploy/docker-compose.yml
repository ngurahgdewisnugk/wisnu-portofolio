# Production stack on the EC2 host (/opt/portfolio).
# APP_IMAGE is set by deploy.sh to an immutable digest, e.g.
#   ghcr.io/ngurahgdewisnugk/wisnu-portofolio@sha256:...
name: portfolio

services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set by deploy.sh}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    # Horizontal scaling: Nginx balances across every replica (see nginx.conf)
    # and Prometheus discovers each one through Docker DNS. WEB_REPLICAS comes
    # from the GitHub variable of the same name (1-3, see docs/monitoring.md).
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    mem_limit: 384m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # ------------------------------------------------------------------ monitoring
  # Nothing below is published to the internet. Prometheus and Grafana bind to
  # 127.0.0.1 on the host and are reached through an SSH tunnel (docs/monitoring.md);
  # the exporters have no host ports at all.

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    env_file: grafana.env   # GF_SECURITY_ADMIN_PASSWORD, written by the CD pipeline
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/portfolio-overview.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    mem_limit: 48m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    read_only: true
    mem_limit: 48m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      - nginx
    read_only: true
    mem_limit: 48m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
