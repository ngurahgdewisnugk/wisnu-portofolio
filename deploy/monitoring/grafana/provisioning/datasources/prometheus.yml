# Provisioned at Grafana startup; the fixed uid is referenced by the dashboard JSON.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      prometheusType: Prometheus
      # List Prometheus' own alert rules under Grafana -> Alerting -> Alert rules,
      # so the Prometheus UI is never needed.
      manageAlerts: true
