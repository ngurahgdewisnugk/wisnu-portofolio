# Dashboards as code: every JSON file in /etc/grafana/dashboards is loaded
# (and reloaded when it changes). Edits in the UI cannot be saved over them;
# change the JSON in git and let the pipeline deploy it.
apiVersion: 1

providers:
  - name: portfolio
    orgId: 1
    folder: Portfolio
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
