# Prometheus on the EC2 host. Scrapes everything over the internal Docker
# network; nothing here is reachable from the internet.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every Next.js replica, found through Docker's embedded DNS: the service
  # name "web" resolves to one A record per replica. Scaling WEB_REPLICAS up
  # or down adds or removes targets within one refresh, no config change.
  - job_name: portfolio-web
    metrics_path: /api/metrics
    dns_sd_configs:
      - names: ["web"]
        type: A
        port: 3000
        refresh_interval: 15s

  # Host metrics of the EC2 instance (CPU, memory, swap, disk, load).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: portfolio-ec2

  # Nginx connection and request counters (stub_status).
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # The blackbox exporter's own health.
  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Synthetic checks through Nginx, the same path a visitor takes:
  # Nginx -> round robin -> a web replica.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/health
          - http://nginx/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
