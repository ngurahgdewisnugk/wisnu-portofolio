# Reverse proxy and load balancer in front of the Next.js replicas.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # Structured (JSON) access log to stdout, collected by Docker.
  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Basic abuse protection for API routes (they call the GitHub API).
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;

  # Docker's embedded DNS. Using a variable in proxy_pass makes Nginx
  # re-resolve "web" every 10s, so scaled replicas are picked up and
  # requests are spread across all of them (DNS round robin).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;

    set $web_upstream web;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Liveness of Nginx itself (container healthcheck).
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Prometheus metrics stay on the internal Docker network only.
    location = /api/metrics {
      return 404;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://$web_upstream:3000;
    }

    location / {
      proxy_pass http://$web_upstream:3000;
    }
  }

  # Internal status endpoint for nginx-prometheus-exporter. Port 8080 is not
  # published to the host, and only Docker's private ranges may call it.
  server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
      stub_status;
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      allow 10.0.0.0/8;
      allow 192.168.0.0/16;
      deny all;
    }

    location / {
      return 404;
    }
  }
}
