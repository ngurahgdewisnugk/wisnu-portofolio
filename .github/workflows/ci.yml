# Continuous Integration: runs on every push and on pull requests to main.
# Nothing here deploys; deployment lives in cd.yml and only runs from main.
#
# Supply-chain policy: every third-party action is pinned to a full commit SHA
# (the tag is kept in a comment for readability). Tags can be moved; SHAs can't.
# See the March 2026 trivy-action incident (GHSA-69fq-xp46-6x23).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Reads package-lock.json only; fails on any HIGH or CRITICAL advisory.
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep 1.178.0
        run: pipx install semgrep==1.178.0

      # Gate: any ERROR-severity finding fails the job.
      # WARNING/INFO findings are printed for review but do not block.
      - name: Semgrep scan (fail on ERROR)
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --exclude tests \
            --severity ERROR \
            --metrics off \
            --error

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Official release binary, verified against the published checksum.
      - name: Install gitleaks (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" gitleaks
          ./gitleaks version

      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --no-banner --verbose .

  docker:
    name: Docker build, scan, smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: wisnu-portofolio:ci
      # On pull requests github.sha is a temporary merge commit, so use the PR head.
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fails on HIGH/CRITICAL vulnerabilities that already have a fix,
      # plus any secret baked into the image. Unfixed CVEs are reported only,
      # because there is no upgrade that could remove them yet.
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 3000:3000 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "App is healthy after ${i}s"
              break
            fi
            sleep 1
          done

          echo "--- /health";  curl -fsS http://127.0.0.1:3000/health;  echo
          echo "--- /version"; curl -fsS http://127.0.0.1:3000/version; echo

          commit=$(curl -fsS http://127.0.0.1:3000/version | jq -r .commit)
          if [ "$commit" != "$GIT_SHA" ]; then
            echo "::error::/version reports ${commit}, expected ${GIT_SHA}"
            exit 1
          fi

          user=$(docker exec app id -u)
          if [ "$user" = "0" ]; then
            echo "::error::Container runs as root"
            exit 1
          fi

          echo "Version matches ${GIT_SHA} and container runs as uid ${user}"

      - name: Container logs
        if: failure()
        run: docker logs app || true
